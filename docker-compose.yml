# Postgres for local development only. These credentials belong to this container, not to any real environment.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brujula
      POSTGRES_PASSWORD: brujula
      POSTGRES_DB: brujula
    ports:
      # 5433 so it does not clash with a local Postgres on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brujula"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
